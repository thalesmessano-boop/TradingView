services:
  - type: web
    name: tradingview-xauusd-webhook
    runtime: docker
    dockerfilePath: ./webhook/Dockerfile
    dockerContext: ./webhook
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_TO_NUMBER
        sync: false
      - key: META_TEMPLATE_NAME
        sync: false
      - key: META_TEMPLATE_LANG
        value: pt_BR
