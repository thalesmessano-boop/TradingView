services:
  - type: web
    name: tradingview-xauusd-webhook
    runtime: docker
    dockerfilePath: ./webhook/Dockerfile
    dockerContext: ./webhook
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "whatsapp:+14155238886"
      - key: WHATSAPP_TO
        sync: false
